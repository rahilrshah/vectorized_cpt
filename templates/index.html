<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPT Code Search - Vertex AI Powered</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 300;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .search-section {
            padding: 40px;
            text-align: center;
        }

        .search-box {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 30px auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 20px;
            font-size: 1.1em;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: #4CAF50;
            box-shadow: 0 0 20px rgba(76, 175, 80, 0.2);
        }

        .search-btn {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .search-btn:disabled {
            background: #cccccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .examples {
            margin: 30px 0;
            text-align: center;
        }

        .examples h3 {
            color: #666;
            margin-bottom: 15px;
        }

        .example-btn {
            background: #f5f5f5;
            border: 1px solid #ddd;
            padding: 8px 16px;
            margin: 5px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .example-btn:hover {
            background: #e8f5e8;
            border-color: #4CAF50;
        }

        .loading {
            display: none;
            color: #4CAF50;
            font-size: 1.1em;
            margin: 20px 0;
        }

        .results-section {
            display: none;
            padding: 0 40px 40px 40px;
        }

        .results-header {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .result-card {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }

        .result-card:hover {
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .cpt-code {
            background: #4CAF50;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 1.1em;
        }

        .similarity-score {
            background: #2196F3;
            color: white;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.9em;
        }

        .result-description {
            color: #333;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        .result-category {
            color: #666;
            font-size: 0.9em;
            font-style: italic;
        }

        .status-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.9);
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .status-ready {
            border-left: 4px solid #4CAF50;
        }

        .status-error {
            border-left: 4px solid #f44336;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                border-radius: 10px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .search-section {
                padding: 20px;
            }
            
            .result-header {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 CPT Code Search</h1>
            <p>AI-Powered Medical Billing Code Discovery using Vertex AI Vector Search</p>
        </div>

        <div class="search-section">
            <div class="search-box">
                <input type="text" id="searchInput" class="search-input" 
                       placeholder="Describe a medical procedure (e.g., 'knee surgery', 'coronary bypass', 'skin lesion removal')"
                       maxlength="500">
            </div>
            
            <button id="searchBtn" class="search-btn">🔍 Find CPT Codes</button>
            
            <div id="loading" class="loading">
                🔄 Searching medical procedures using AI...
            </div>

            <div class="examples">
                <h3>Try these examples:</h3>
                <button class="example-btn" onclick="setExample('bilateral total knee arthroplasty')">Knee Surgery</button>
                <button class="example-btn" onclick="setExample('coronary artery bypass graft')">Heart Surgery</button>
                <button class="example-btn" onclick="setExample('laparoscopic appendectomy')">Appendectomy</button>
                <button class="example-btn" onclick="setExample('cataract extraction with lens implant')">Eye Surgery</button>
                <button class="example-btn" onclick="setExample('skin lesion excision')">Skin Surgery</button>
            </div>
        </div>

        <div id="resultsSection" class="results-section">
            <div id="resultsHeader" class="results-header">
                <h2>Search Results</h2>
                <p id="resultsCount"></p>
            </div>
            <div id="resultsContainer"></div>
        </div>
    </div>

    <div id="statusIndicator" class="status-indicator">
        <span id="statusText">Checking system status...</span>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const loading = document.getElementById('loading');
        const resultsSection = document.getElementById('resultsSection');
        const resultsContainer = document.getElementById('resultsContainer');
        const resultsCount = document.getElementById('resultsCount');
        const statusIndicator = document.getElementById('statusIndicator');
        const statusText = document.getElementById('statusText');

        // Check system status
        async function checkStatus() {
            try {
                const response = await fetch('/status');
                const data = await response.json();
                
                if (data.success && data.vertex_ai.status === 'ready') {
                    statusIndicator.className = 'status-indicator status-ready';
                    statusText.textContent = '✅ Vector Search Ready';
                } else {
                    statusIndicator.className = 'status-indicator status-error';
                    statusText.textContent = '⚠️ System Initializing';
                }
            } catch (error) {
                statusIndicator.className = 'status-indicator status-error';
                statusText.textContent = '❌ Status Check Failed';
            }
        }

        // Search function
        async function performSearch() {
            const query = searchInput.value.trim();
            
            if (!query) {
                alert('Please enter a medical procedure description');
                return;
            }

            searchBtn.disabled = true;
            loading.style.display = 'block';
            resultsSection.style.display = 'none';

            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: query })
                });

                const data = await response.json();

                if (data.success) {
                    displayResults(data.results, data.query);
                } else {
                    alert('Search failed: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                alert('Search failed: ' + error.message);
            } finally {
                searchBtn.disabled = false;
                loading.style.display = 'none';
            }
        }

        // Display results
        function displayResults(results, query) {
            resultsCount.textContent = `Found ${results.length} matching CPT codes for: "${query}"`;
            resultsContainer.innerHTML = '';

            if (results.length === 0) {
                resultsContainer.innerHTML = '<p style="text-align: center; color: #666; font-size: 1.1em; padding: 40px;">No matching CPT codes found. Try a different description.</p>';
            } else {
                results.forEach((result, index) => {
                    const resultCard = document.createElement('div');
                    resultCard.className = 'result-card';
                    
                    resultCard.innerHTML = `
                        <div class="result-header">
                            <div class="cpt-code">CPT ${result.cpt_code}</div>
                            <div class="similarity-score">${(result.similarity * 100).toFixed(1)}% Match</div>
                        </div>
                        <div class="result-description">${result.description}</div>
                        ${result.category ? `<div class="result-category">Category: ${result.category}</div>` : ''}
                    `;
                    
                    resultsContainer.appendChild(resultCard);
                });
            }

            resultsSection.style.display = 'block';
            resultsSection.scrollIntoView({ behavior: 'smooth' });
        }

        // Set example query
        function setExample(text) {
            searchInput.value = text;
            searchInput.focus();
        }

        // Event listeners
        searchBtn.addEventListener('click', performSearch);
        
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                performSearch();
            }
        });

        // Initialize
        checkStatus();
        setInterval(checkStatus, 30000); // Check status every 30 seconds
        searchInput.focus();
    </script>
</body>
</html>
