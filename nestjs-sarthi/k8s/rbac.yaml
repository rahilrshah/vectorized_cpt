apiVersion: v1
kind: ServiceAccount
metadata:
  name: cpt-vector-service
  namespace: sarthi-backend
  labels:
    app: cpt-vector-service
    component: rbac
  annotations:
    iam.gke.io/gcp-service-account: cpt-vector-service@sarthi-healthcare-prod.iam.gserviceaccount.com

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: sarthi-backend
  name: cpt-vector-service-role
  labels:
    app: cpt-vector-service
    component: rbac
rules:
# Allow reading ConfigMaps and Secrets
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
# Allow updating status
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "patch"]
# Allow service mesh integration
- apiGroups: [""]
  resources: ["services", "endpoints"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cpt-vector-service-binding
  namespace: sarthi-backend
  labels:
    app: cpt-vector-service
    component: rbac
subjects:
- kind: ServiceAccount
  name: cpt-vector-service
  namespace: sarthi-backend
roleRef:
  kind: Role
  name: cpt-vector-service-role
  apiGroup: rbac.authorization.k8s.io

---
# Cluster role for metrics collection
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cpt-vector-service-metrics
  labels:
    app: cpt-vector-service
    component: rbac
rules:
- apiGroups: [""]
  resources: ["nodes", "nodes/metrics", "pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cpt-vector-service-metrics-binding
  labels:
    app: cpt-vector-service
    component: rbac
subjects:
- kind: ServiceAccount
  name: cpt-vector-service
  namespace: sarthi-backend
roleRef:
  kind: ClusterRole
  name: cpt-vector-service-metrics
  apiGroup: rbac.authorization.k8s.io